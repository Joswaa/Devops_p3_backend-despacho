name: Backend Despachos Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr # <--- Agregamos este ID para poder usar su salida
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_BACKEND_DESPACHOS }}:latest ./Springboot-API-REST-DESPACHO

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_BACKEND_DESPACHOS }}:latest

      - name: TODO - Update deployment
        run: |
          echo "TODO: agregar aquí el comando real de despliegue en EKS/EC2 para el backend de despachos"

      - name: Update Kubeconfig and Deploy to EKS
        run: |
          # 1. Conectar GitHub Actions con tu clúster de EKS
          aws eks update-kubeconfig --region us-east-1 --name eks-proyecto-innovatech
          
          # 2. Ordenarle a Kubernetes que levante o actualice la app
          kubectl apply -f k8s/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-despachos-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-despachos-db
  template:
    metadata:
      labels:
        app: mysql-despachos-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword123"
        - name: MYSQL_DATABASE
          value: "despachos_db"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-despachos-service
  namespace: default
spec:
  selector:
    app: mysql-despachos-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despachos
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-despachos
  template:
    metadata:
      labels:
        app: backend-despachos
    spec:
      initContainers: # <-- CONGELA EL BACKEND HASTA QUE MYSQL REACCIONE
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 mysql-despachos-service 3306; do echo waiting for mysql; sleep 2; done;']
      containers:
      - name: backend-despachos
        image: 921558516087.dkr.ecr.us-east-1.amazonaws.com/backend-despachos:latest
        ports:
        - containerPort: 8081
        env:
        - name: DB_ENDPOINT
          value: "mysql-despachos-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "despachos_db"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword123"
        - name: RESTART_VERSION
          value: "3" # <-- Cambiamos a 3 para forzar la actualización

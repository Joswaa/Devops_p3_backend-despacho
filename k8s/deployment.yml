apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despachos
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-despachos
  template:
    metadata:
      labels:
        app: backend-despachos
    spec:
      containers:
      - name: backend-despachos
        image: 921558516087.dkr.ecr.us-east-1.amazonaws.com/backend-despachos:latest
        ports:
        - containerPort: 8081
        env:
        # Engañamos al conector pasándole una URL de base de datos H2 local en memoria
        - name: DB_ENDPOINT
          value: "localhost"
        - name: DB_PORT
          value: "8081"
        - name: DB_NAME
          value: "mem:despachos_db;DB_CLOSE_DELAY=-1;MODE=MySQL"
        - name: DB_USERNAME
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "create-drop"
        - name: RESTART_VERSION
          value: "5" # Forzamos el cambio radical
---
apiVersion: v1
kind: Service
metadata:
  name: backend-despachos-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: backend-despachos
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
